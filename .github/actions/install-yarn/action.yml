name: Yarn Install
description: Installs and caches yarn dependencies

runs:
  using: "composite"
  steps:
    - name: 'Enable corepack'
      shell: bash
      run: corepack enable

    - name: 'Setup node'
      uses: actions/setup-node@v4
      with:
        node-version: 20.9
        cache: yarn

    # This step should prefer the cached dependencies and restore node_modules
    - name: Install dependencies
      shell: bash
      run: yarn --immutable
